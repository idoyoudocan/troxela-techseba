<!doctype html>
<html lang="bn" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock Screen - Modern Admin Dashboard</title>
    <meta name="description" content="Secure lock screen with live real-time clock, quick unlock, and account switcher." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="./vendor/tailwind-play.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            }
          }
        }
      }
    </script>

    <!-- Alpine.js Core Library -->
    <script defer src="./vendor/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>

  <body 
    x-data="authLockScreen" 
    x-cloak 
    class="min-h-full flex flex-col justify-center bg-slate-900 text-white font-sans antialiased selection:bg-indigo-500 selection:text-white relative overflow-x-hidden"
  >

    <!-- Top Navigation Bar -->
    <div class="absolute top-4 left-4 right-4 sm:top-6 sm:left-8 sm:right-8 flex items-center justify-between z-10">
      <a 
        href="login.html" 
        class="inline-flex items-center gap-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 px-3 py-1.5 rounded-xl backdrop-blur-md transition-all hover:-translate-x-0.5"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        লগইন স্ক্রিন
      </a>

      <!-- Quick Dashboard shortcut -->
      <a 
        href="dashboard.html" 
        class="text-xs text-slate-400 hover:text-indigo-400 font-medium"
      >
        ড্যাশবোর্ড ডেমো
      </a>
    </div>

    <!-- Decorative Gradient Mesh Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
      <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[120px]"></div>
      <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px]"></div>
    </div>

    <!-- Container -->
    <div class="w-full max-w-sm mx-auto px-4 py-10 sm:px-6">

      <!-- Live Digital Clock Display -->
      <div class="text-center mb-8">
        <div class="text-4xl sm:text-5xl font-bold tracking-tight text-white tabular-nums" x-text="currentTime">
          12:45:00
        </div>
        <div class="text-xs sm:text-sm text-slate-400 mt-1 font-medium" x-text="currentDate">
          বৃহস্পতিবার, ১০ সেপ্টেম্বর ২০২৬
        </div>
      </div>

      <!-- Lock Card -->
      <div class="bg-slate-800/60 backdrop-blur-xl rounded-3xl p-6 sm:p-7 shadow-2xl border border-slate-700/60 text-center">

        <!-- User Profile Avatar -->
        <div class="relative w-20 h-20 mx-auto mb-4">
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=256" 
            alt="Md. Imran Hossain" 
            class="w-20 h-20 rounded-full object-cover ring-4 ring-indigo-500/30 shadow-lg"
          />
          <!-- Locked Padlock Badge -->
          <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-indigo-600 border-2 border-slate-900 flex items-center justify-center text-white shadow-xs">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
        </div>

        <h2 class="text-base font-bold text-white">মোঃ ইমরান হোসেন</h2>
        <p class="text-xs text-indigo-400 font-medium">সুপার এডমিনিস্ট্রেটর</p>
        <p class="text-[11px] text-slate-400 mt-0.5">mdimranhossaingd@gmail.com</p>

        <!-- Unlock Form -->
        <form @submit.prevent="handleUnlock()" class="mt-6 space-y-3">
          
          <div class="relative">
            <input 
              :type="showPassword ? 'text' : 'password'" 
              x-model="password" 
              required
              placeholder="পাসওয়ার্ড লিখুন..." 
              class="w-full pl-4 pr-11 py-2.5 text-sm bg-slate-900/80 border border-slate-700 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition-all"
              :class="{'border-rose-500 ring-1 ring-rose-500': hasError}"
            />
            <button 
              type="button" 
              @click="showPassword = !showPassword" 
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-white"
            >
              <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
              </svg>
            </button>
          </div>

          <p x-show="hasError" class="text-[11px] text-rose-400 text-left">অনুগ্রহ করে সঠিক পাসওয়ার্ড লিখুন</p>

          <button 
            type="submit" 
            :disabled="isLoading"
            class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-md shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60"
          >
            <svg x-show="isLoading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span x-text="isLoading ? 'আনলক হচ্ছে...' : 'স্ক্রিন আনলক করুন'"></span>
            <svg x-show="!isLoading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
            </svg>
          </button>

        </form>

        <!-- Switch Account Link -->
        <div class="mt-5 pt-4 border-t border-slate-700/60">
          <p class="text-xs text-slate-400">
            আপনি কি ইমরান হোসেন নন? 
            <a href="login.html" class="text-indigo-400 font-semibold hover:underline block mt-1">
              অন্য অ্যাকাউন্টে লগইন করুন
            </a>
          </p>
        </div>

      </div>

    </div>

    <!-- Alpine.js Script Controller -->
    <script>
      document.addEventListener('alpine:init', () => {
        Alpine.data('authLockScreen', () => ({
          password: '',
          showPassword: false,
          isLoading: false,
          hasError: false,
          currentTime: '',
          currentDate: '',

          init() {
            this.updateTime();
            setInterval(() => this.updateTime(), 1000);
          },

          updateTime() {
            const now = new Date();
            this.currentTime = now.toLocaleTimeString('en-US', {
              hour12: true,
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });
            this.currentDate = now.toLocaleDateString('bn-BD', {
              weekday: 'long',
              day: 'numeric',
              month: 'long',
              year: 'numeric'
            });
          },

          handleUnlock() {
            if (!this.password.trim()) {
              this.hasError = true;
              return;
            }
            this.hasError = false;
            this.isLoading = true;

            setTimeout(() => {
              this.isLoading = false;
              window.location.href = 'dashboard.html';
            }, 600);
          }
        }));
      });
    </script>
  </body>
</html>
