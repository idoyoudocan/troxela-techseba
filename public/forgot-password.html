<!doctype html>
<html lang="bn" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Modern Admin Dashboard</title>
    <meta name="description" content="Password recovery page with email verification, resend countdown timer, and direct OTP routing." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="./vendor/tailwind-play.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              }
            }
          }
        }
      }
    </script>

    <!-- Alpine.js Core Library -->
    <script defer src="./vendor/alpine.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>

  <body 
    x-data="authForgotPassword" 
    x-cloak 
    class="min-h-full flex flex-col justify-center bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white relative overflow-x-hidden"
  >

    <!-- Top Navigation Bar -->
    <div class="absolute top-4 left-4 right-4 sm:top-6 sm:left-8 sm:right-8 flex items-center justify-between z-10">
      <a 
        href="login.html" 
        class="inline-flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-3 py-1.5 rounded-xl shadow-xs transition-all hover:-translate-x-0.5"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        লগইনে ফিরুন
      </a>

      <!-- Dark Mode Toggle -->
      <button 
        @click="toggleDarkMode()" 
        class="p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 shadow-xs transition-colors"
      >
        <template x-if="!darkMode">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </template>
        <template x-if="darkMode">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </template>
      </button>
    </div>

    <!-- Decorative Glow -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
      <div class="absolute -top-40 right-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-40 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Container -->
    <div class="w-full max-w-md mx-auto px-4 py-12 sm:px-6">

      <!-- Header -->
      <div class="text-center mb-8">
        <!-- Key / Unlock Icon -->
        <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-100 dark:border-indigo-900/50 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shadow-lg shadow-indigo-500/10 mb-4">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
          </svg>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white">পাসওয়ার্ড ভুলে গেছেন?</h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1.5 max-w-sm mx-auto">
          চিন্তার কিছু নেই! আপনার অ্যাকাউন্টের ইমেইল দিন, আমরা পাসওয়ার্ড রিসেটের নির্দেশাবলী ও ওটিপি (OTP) কোড পাঠাবো।
        </p>
      </div>

      <!-- Card -->
      <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/80 dark:border-slate-800">

        <!-- Form View (Initial) -->
        <div x-show="!isSent">
          <form @submit.prevent="handleSubmit()" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                আপনার রেজিস্টার্ড ইমেইল <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                  </svg>
                </span>
                <input 
                  type="email" 
                  x-model="email" 
                  required
                  placeholder="admin@example.com" 
                  class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-hidden focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white placeholder-slate-400 transition-all"
                  :class="{'border-rose-400 ring-1 ring-rose-400': error}"
                />
              </div>
              <p x-show="error" x-text="error" class="text-[11px] text-rose-500 mt-1"></p>
            </div>

            <div class="pt-2">
              <button 
                type="submit" 
                :disabled="isLoading"
                class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-600/25 transition-all duration-150 flex items-center justify-center gap-2 disabled:opacity-60 cursor-pointer"
              >
                <svg x-show="isLoading" class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="isLoading ? 'কোড পাঠানো হচ্ছে...' : 'রিসেট কোড পাঠান'"></span>
                <svg x-show="!isLoading" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
              </button>
            </div>
          </form>
        </div>

        <!-- Success View (After sending email) -->
        <div x-show="isSent" x-transition class="text-center py-2 space-y-4">
          <!-- Animated Check Circle -->
          <div class="w-16 h-16 mx-auto rounded-full bg-emerald-100 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>

          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white">ইমেইল পাঠানো হয়েছে!</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">
              আমরা একটি ৬-সংখ্যার ভেরিফিকেশন ওটিপি পাঠিয়ছি: <br/>
              <span class="font-semibold text-slate-800 dark:text-slate-200" x-text="email"></span> ঠিকানায়।
            </p>
          </div>

          <!-- Direct button to OTP Page -->
          <div class="pt-2">
            <a 
              href="otp.html" 
              class="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-600/25 transition-all inline-flex items-center justify-center gap-2"
            >
              <span>OTP কোড প্রবেশ করান</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </a>
          </div>

          <!-- Resend Countdown -->
          <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
            <p class="text-xs text-slate-500 dark:text-slate-400">
              ইমেইল পাননি? 
              <button 
                type="button" 
                @click="resendCode()" 
                :disabled="countdown > 0"
                class="font-semibold text-indigo-600 dark:text-indigo-400 hover:underline disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <span x-show="countdown > 0" x-text="`আবার পাঠান (${countdown}s)`"></span>
                <span x-show="countdown === 0">পুনরায় কোড পাঠান</span>
              </button>
            </p>
          </div>
        </div>

        <!-- Back to Login Link -->
        <div class="text-center mt-6 pt-5 border-t border-slate-100 dark:border-slate-800">
          <a href="login.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            <span>লগইন পেজে ফিরে যান</span>
          </a>
        </div>

      </div>

    </div>

    <!-- Alpine.js Script Controller -->
    <script>
      document.addEventListener('alpine:init', () => {
        Alpine.data('authForgotPassword', () => ({
          email: '',
          isLoading: false,
          isSent: false,
          error: '',
          countdown: 0,
          timerInterval: null,
          darkMode: false,

          init() {
            try {
              const savedDark = localStorage.getItem('admin_dark_mode');
              if (savedDark !== null) {
                this.darkMode = JSON.parse(savedDark);
                if (this.darkMode) document.documentElement.classList.add('dark');
              }
            } catch (e) {}
          },

          toggleDarkMode() {
            this.darkMode = !this.darkMode;
            if (this.darkMode) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
            try {
              localStorage.setItem('admin_dark_mode', JSON.stringify(this.darkMode));
            } catch (e) {}
          },

          handleSubmit() {
            this.error = '';
            if (!this.email.trim()) {
              this.error = 'ইমেইল অ্যাড্রেস প্রদান করুন';
              return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email)) {
              this.error = 'সঠিক ইমেইল ফরম্যাট প্রদান করুন';
              return;
            }

            this.isLoading = true;
            setTimeout(() => {
              this.isLoading = false;
              this.isSent = true;
              this.startCountdown();
            }, 800);
          },

          startCountdown() {
            this.countdown = 60;
            if (this.timerInterval) clearInterval(this.timerInterval);
            this.timerInterval = setInterval(() => {
              if (this.countdown > 0) {
                this.countdown--;
              } else {
                clearInterval(this.timerInterval);
              }
            }, 1000);
          },

          resendCode() {
            if (this.countdown > 0) return;
            this.startCountdown();
            alert(`একটি নতুন ভেরিফিকেশন কোড পাঠানো হয়েছে: ${this.email}`);
          }
        }));
      });
    </script>
  </body>
</html>
